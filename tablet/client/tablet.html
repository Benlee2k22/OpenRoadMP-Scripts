<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--accent:#a31bff;--accent2:#7421d9;--line:#41305d;--muted:#a8a1bc}
*{box-sizing:border-box}body{margin:0;background:transparent;color:#f7f4ff;font:14px Inter,system-ui,Arial,sans-serif}
.tablet{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(1180px,95vw);height:min(740px,90vh);display:flex;border:1px solid #6b458d;border-radius:28px;overflow:hidden;background:linear-gradient(125deg,#0a0913,#100c20 65%,#160c28);box-shadow:0 0 0 5px #0a0815bb,0 30px 110px #000e,0 0 48px #7213c02e}
aside{width:228px;flex-shrink:0;background:linear-gradient(180deg,#0c0a17,#171028);padding:28px 14px;border-right:1px solid #342347;display:flex;flex-direction:column}
.brand{font-size:26px;letter-spacing:1.5px;font-weight:800;color:#d5a4ff;margin:8px 13px 30px;text-shadow:0 0 24px #a31bff66}
nav button{display:block;width:100%;padding:15px 16px;margin-bottom:7px;border:1px solid transparent;border-radius:11px;text-align:left;background:transparent;color:#c4b9d9;cursor:pointer;font-weight:600;transition:.16s}
nav button::before{content:'◇';color:#bd5cff;margin-right:13px;font-size:17px}
nav button.active,nav button:hover{background:linear-gradient(95deg,#7d0bdf,#4b168e);color:white;border-color:#a742ed;box-shadow:0 4px 22px #890cff30}
main{flex:1;padding:31px 34px;overflow:auto;background:radial-gradient(ellipse at 75% -10%,#5d168b35,transparent 50%)}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:21px;border-bottom:1px solid #302541}
.muted{color:var(--muted)}.small{font-size:11px;letter-spacing:1.8px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin:24px 0}
.card{background:linear-gradient(140deg,#20172f,#100f1d);padding:22px;border:1px solid #38284d;border-radius:15px;box-shadow:inset 0 1px #ffffff08}
.value{font-size:30px;font-weight:800;margin-top:10px;color:white;letter-spacing:-1px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.actions button{padding:19px;text-align:left;background:linear-gradient(130deg,#27143e,#171324);border:1px solid #60308e;border-radius:13px;color:white;cursor:pointer;transition:.2s;font-weight:600}
.actions button:hover{background:linear-gradient(120deg,#7212b4,#3c146d);border-color:#c15cff;transform:translateY(-2px);box-shadow:0 5px 25px #9c1bff33}
button{font:inherit;cursor:pointer}button:not(nav button):not(.actions button){border:1px solid #863bc0;background:linear-gradient(115deg,#7f0fc5,#4b188a);border-radius:9px;color:white;padding:10px 15px;margin:3px 4px 3px 0;font-weight:600}
button:not(nav button):not(.actions button):hover{filter:brightness(1.22)}
input,select,textarea{background:#151123;color:white;border:1px solid #65438b;border-radius:9px;padding:12px;margin:5px;max-width:100%}
h1{margin:5px 0 0;font-size:29px;letter-spacing:-.7px}h2{font-size:18px;margin:25px 0 15px}h3{font-size:15px;margin:22px 0 10px}p{line-height:1.6}#message{margin-top:16px;color:#dbadff}
::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:#58337e;border-radius:9px}
@media(max-width:800px){aside{width:170px}.brand{font-size:19px}main{padding:20px}.cards{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
</style></head>
<body><div class="tablet"><aside><div class="brand">GLOBAL<span style="color:white">MP</span></div><nav>
<button class="active" data-page="dashboard">Dashboard</button>
<button data-page="jobs">Jobs</button><button data-page="garage">Garages</button>
<button data-page="company">Companies & VTCs</button><button data-page="convoys">Convoys</button>
<button data-page="settings">Settings</button>
</nav></aside><main><div class="top"><div><div class="muted small">GLOBALMP DRIVER PORTAL</div><h1 id="heading">Dashboard</h1></div><span class="muted" id="online">Loading…</span><button id="closeTablet" style="background:#6c3eb5;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer">✕ Close</button></div>
<div id="content"><p class="muted" id="welcome">Loading driver details…</p>
<div class="cards">
<div class="card"><div class="muted">Balance</div><div class="value" id="money">—</div></div>
<div class="card"><div class="muted">Deliveries</div><div class="value" id="deliveries">—</div></div>
<div class="card"><div class="muted">Distance driven</div><div class="value" id="distance">—</div></div>
</div><h2>Quick actions</h2><div class="actions">
<button data-action="garage">Open my garage →</button><button data-action="company">Open company management →</button>
</div><p id="message"></p></div></main></div>
<script>
// Match OpenRoadMP's built-in editor: capture the mouse while the tablet is open.
if (window.mp && typeof mp.cursor === "function") mp.cursor(true);
const closeTablet = () => {
  if (window.mp && typeof mp.cursor === "function") mp.cursor(false);
  if (window.mp && typeof mp.emitServer === "function") mp.emitServer("closeTablet");
};
document.addEventListener("keydown", e => { if (e.key === "Escape") closeTablet(); });
const call = (name,...args)=>window.mp && typeof mp.callServer==="function" ? mp.callServer(name,...args) : Promise.reject(new Error("OpenRoadMP browser API unavailable"));
const content=document.querySelector("#content"), original=content.innerHTML;
async function overview(){
 content.innerHTML=original;
 try{const d=await call("overview");
 document.querySelector("#welcome").textContent="Welcome back, "+d.name+" • "+d.server;
 document.querySelector("#online").textContent=d.online+" online";
 document.querySelector("#money").textContent="€"+Number(d.money).toLocaleString();
 document.querySelector("#deliveries").textContent=Number(d.deliveries).toLocaleString();
 document.querySelector("#distance").textContent=Number(d.distanceKm).toLocaleString(undefined,{maximumFractionDigits:1})+" km";
 }catch(e){document.querySelector("#welcome").textContent="Unable to load data: "+e.message;}
}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const message=e=>{const el=document.querySelector("#message");if(el)el.textContent=e};
async function garage(){
 const d=await call("garageState");
 content.innerHTML='<p class="muted">Garage: '+d.owned.length+' / '+d.slots+' slots. Existing tuning is preserved.</p><h2>My trucks</h2><div id="owned" class="actions"></div><h2>Get more vehicles</h2><div id="dealer" class="actions"></div><p id="message"></p>';
 document.querySelector("#owned").innerHTML=d.owned.map(t=>'<button data-garage="'+(t.id===d.current?'none':'drive')+'" data-id="'+t.id+'">'+esc(t.label)+' · '+t.parts+' saved parts '+(t.id===d.current?'(Driving)':'— Drive')+'</button>'+(t.id===d.current?'':'<button data-garage="giveback" data-id="'+t.id+'">Give back '+esc(t.label)+'</button>')).join("")||'<p>No trucks yet</p>';
 document.querySelector("#dealer").innerHTML='<div class="card" style="grid-column:1/-1"><strong>Purchases only</strong><p class="muted">Only vehicles you already own appear above. Use the authorised in-game dealership to purchase additional trucks.</p></div>';

}
async function vtc(){
 const d=await call("vtcState");let html='';
 if(d.mine){
 const m=d.mine;html='<h2>'+esc(m.name)+'</h2><p class="muted">Your rank: '+esc(m.role)+' · Joining: '+esc(m.join_mode)+'</p>';
 if(m.role==="owner")html+='<button data-vtc="mode" data-mode="'+(m.join_mode==="open"?"applications":"open")+'">Switch to '+(m.join_mode==="open"?"Applications":"Open joining")+'</button>';
 html+='<h3>Members</h3><div class="actions">'+m.members.map(x=>'<div class="card">'+esc(x.display_name)+' ('+esc(x.role)+')'+(m.role==="owner"&&x.role!=="owner"?'<div><button data-vtc="role" data-account="'+esc(x.account)+'" data-role="'+(x.role==="manager"?"driver":"manager")+'">Toggle manager</button><button data-vtc="kick" data-account="'+esc(x.account)+'">Remove</button></div>':'')+'</div>').join("")+'</div>';
 if(m.role==="owner"||m.role==="manager")html+='<h3>Applications</h3>'+d.applications.map(x=>'<div class="card">'+esc(x.display_name)+' — '+esc(x.message)+' <button data-vtc="review" data-id="'+x.id+'" data-accept="true">Accept</button><button data-vtc="review" data-id="'+x.id+'" data-accept="false">Reject</button></div>').join("");
 html+='<p><button data-vtc="leave">Leave / dissolve VTC</button></p>';
 }else{
 html='<h2>Create a VTC</h2><input id="vtcName" placeholder="Company name (3–40 characters)" maxlength="40"><select id="vtcMode"><option value="applications">Applications</option><option value="open">Open joining</option></select><button data-vtc="create">Create VTC</button><h2>VTC Directory</h2>';
 html+='<div class="actions">'+d.directory.map(x=>'<div class="card"><strong>'+esc(x.name)+'</strong><p>'+x.members+' members · '+esc(x.join_mode)+'</p><button data-vtc="join" data-id="'+x.id+'">'+(x.join_mode==="open"?"Join now":"Apply")+'</button></div>').join("")+'</div>';
 if(d.pending.length)html+='<p class="muted">Pending applications: '+d.pending.length+'</p>';
 }
 content.innerHTML=html+'<p id="message"></p>';
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=async()=>{
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));
 const p=b.dataset.page;document.querySelector("#heading").textContent=b.textContent;
 try{if(p==="dashboard")await overview();else if(p==="garage")await garage();else if(p==="company")await vtc();else content.innerHTML='<p class="muted">This section is not connected yet.</p>';}catch(e){content.innerHTML='<p id="message"></p>';message(e.message);}
});
document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-garage],[data-vtc]");if(!b)return;
 try{
 if(b.dataset.garage){if(b.dataset.garage==="none")return;if(b.dataset.garage==="giveback"&&!confirm("Give back this truck?"))return;await call("garageAction",b.dataset.garage,b.dataset.id);await garage();}
 else{
 const action=b.dataset.vtc;let payload={id:Number(b.dataset.id),account:b.dataset.account,role:b.dataset.role,mode:b.dataset.mode,accept:b.dataset.accept==="true"};
 if(action==="create"){payload.name=document.querySelector("#vtcName").value;payload.mode=document.querySelector("#vtcMode").value;}
 if(action==="join"){payload.message=prompt("Application message (optional):","")??"";}
 if(action==="leave"&&!confirm("Leave or dissolve this VTC?"))return;
 await call("vtcAction",action,payload);await vtc();
 }
 }catch(err){message(err.message);}
});
document.querySelector("#closeTablet").onclick=closeTablet;
overview();
</script></body></html>
